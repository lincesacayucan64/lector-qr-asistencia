<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR - Aula PIP</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 25px auto;
      padding: 16px;
      text-align: center;
    }
    button, select {
      padding: 12px;
      margin: 8px;
      font-size: 16px;
    }
    #lector { width: 100%; margin-top: 20px; }
    #estado, #resultado { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Lector QR - Aula PIP</h2>

  <label for="movimiento">Tipo de asistencia:</label><br>
  <select id="movimiento">
    <option value="INGRESO">Ingreso</option>
    <option value="SALIDA">Salida</option>
  </select>

  <br>
  <button id="iniciar">Iniciar cámara</button>
  <button id="detener" disabled>Detener cámara</button>

  <div id="lector"></div>
  <p id="estado">Selecciona el movimiento e inicia la cámara.</p>
  <p id="resultado"></p>

  <script>
    // IMPORTANTE: reemplaza este texto por la URL /exec
    // de tu aplicación web de Google Apps Script.
    const SCRIPT_URL = "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT";

    let lectorQR = null;
    let procesando = false;

    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");
    const botonIniciar = document.getElementById("iniciar");
    const botonDetener = document.getElementById("detener");

    function mostrarError(mensaje) {
      estado.textContent = mensaje;
      botonIniciar.disabled = false;
      botonDetener.disabled = true;
      procesando = false;
    }

    // La respuesta JSONP de Apps Script llama esta función.
    window.handleQrResponse = function (respuesta) {
      const nombre = respuesta.nombre || "Alumno";
      const movimiento = respuesta.estado || "";

      if (respuesta.exito) {
        estado.textContent = "Registro procesado.";
        resultado.textContent =
          nombre + " — " + movimiento + ". " +
          (respuesta.mensaje || "") +
          (respuesta.hora ? " Hora: " + respuesta.hora : "");
      } else {
        estado.textContent = "No se registró la asistencia.";
        resultado.textContent = respuesta.mensaje || "Revisa el registro.";
      }

      if (respuesta.whatsapp && respuesta.whatsapp.ok === false) {
        resultado.textContent +=
          " Atención: el envío de WhatsApp no está confirmado.";
      }

      botonIniciar.disabled = false;
      botonDetener.disabled = true;
      procesando = false;
    };

    async function detenerCamara() {
      if (lectorQR) {
        try {
          if (lectorQR.isScanning) await lectorQR.stop();
          await lectorQR.clear();
        } catch (error) {
          console.log("La cámara ya estaba detenida.", error);
        }
        lectorQR = null;
      }
      botonIniciar.disabled = false;
      botonDetener.disabled = true;
    }

    async function registrarQR(matricula) {
      if (procesando) return;
      procesando = true;

      const id = String(matricula || "").trim();
      const movimiento = document.getElementById("movimiento").value;

      await detenerCamara();
      // Bloquea nuevas lecturas mientras se procesa la respuesta.
      procesando = true;

      resultado.textContent = "Matrícula leída: " + id;
      estado.textContent = "Enviando asistencia a Aula PIP...";

      if (!id) {
        mostrarError("El QR no contiene una matrícula válida.");
        return;
      }

      if (SCRIPT_URL.indexOf("/exec") === -1 ||
          SCRIPT_URL.indexOf("PEGA_AQUI") !== -1) {
        mostrarError("Falta configurar la URL de Apps Script terminada en /exec.");
        return;
      }

      const callback = "handleQrResponse";
      const url = SCRIPT_URL +
        "?page=registrar_jsonp" +
        "&id=" + encodeURIComponent(id) +
        "&estado=" + encodeURIComponent(movimiento) +
        "&callback=" + callback +
        "&_=" + Date.now();

      const script = document.createElement("script");
      let respondido = false;

      const limpieza = () => {
        script.remove();
        clearTimeout(limite);
      };

      const limite = setTimeout(() => {
        if (respondido) return;
        respondido = true;
        limpieza();
        mostrarError(
          "No se recibió respuesta de Apps Script. Revisa la URL y el despliegue."
        );
      }, 20000);

      window.handleQrResponse = function (respuesta) {
        if (respondido) return;
        respondido = true;
        limpieza();

        const nombre = respuesta.nombre || "Alumno";
        estado.textContent = respuesta.exito
          ? "Respuesta recibida de Aula PIP."
          : "No se registró la asistencia.";

        resultado.textContent =
          nombre + " — " + (respuesta.estado || movimiento) + ". " +
          (respuesta.mensaje || "") +
          (respuesta.hora ? " Hora: " + respuesta.hora : "");

        if (respuesta.exito &&
            respuesta.whatsapp &&
            respuesta.whatsapp.ok === false) {
          resultado.textContent +=
            " WhatsApp: " + (respuesta.whatsapp.mensaje || "No confirmado") + ".";
        }

        botonIniciar.disabled = false;
        botonDetener.disabled = true;
        procesando = false;
      };

      script.onerror = () => {
        if (respondido) return;
        respondido = true;
        limpieza();
        mostrarError("No se pudo conectar con Apps Script.");
      };

      script.src = url;
      document.body.appendChild(script);
    }

    botonIniciar.onclick = async function () {
      if (typeof Html5Qrcode === "undefined") {
        mostrarError("No se cargó la biblioteca del lector QR.");
        return;
      }

      try {
        procesando = false;
        resultado.textContent = "";
        estado.textContent = "Buscando cámara...";

        const camaras = await Html5Qrcode.getCameras();
        if (!camaras || camaras.length === 0) {
          throw new Error("No se detectaron cámaras.");
        }

        lectorQR = new Html5Qrcode("lector");
        await lectorQR.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (texto) => registrarQR(texto),
          () => {}
        );

        botonIniciar.disabled = true;
        botonDetener.disabled = false;
        estado.textContent = "Cámara activa. Escanea el QR del alumno.";
      } catch (error) {
        mostrarError("Error al abrir la cámara: " + error.message);
      }
    };

    botonDetener.onclick = async function () {
      procesando = false;
      await detenerCamara();
      estado.textContent = "Cámara detenida.";
    };
  </script>
</body>
</html>
